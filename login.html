<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0c10">
  <meta name="description" content="Acesse sua conta Nexus Hardware para acompanhar seus pedidos e sua lista de desejos.">
  <title>Entrar | Nexus Hardware</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="login.css">
  <script src="login.js" defer></script>
</head>
<body class="login-page login-auth-page">
  <header class="login-header">
    <a class="brand" href="loja.html" aria-label="Nexus Hardware - início">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span>NEXUS<span class="brand-light">HARDWARE</span></span>
    </a>
  </header>

  <main class="login-main">
    <section class="login-panel">
      <div class="login-card">
        <h2><em>Entre na sua conta.</em></h2>
        <p class="login-intro">Acesse para acompanhar seus pedidos e continuar de onde parou.</p>

        <form id="login-form">
          <label class="field-label" for="email">E-mail</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">✉</span>
            <input id="email" name="email" type="email" placeholder="voce@email.com" autocomplete="email" required>
          </div>

          <div class="password-label-row">
            <label class="field-label" for="password">Senha</label>
            <button class="forgot-link" id="forgot-password" type="button">Esqueceu a senha?</button>
          </div>
          <div class="input-wrap">
            <span class="input-icon lock-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="10" width="16" height="11" rx="2"></rect>
                <path d="M8 10V7a4 4 0 1 1 8 0v3"></path>
              </svg>
            </span>
            <input id="password" name="password" type="password" placeholder="Digite sua senha" autocomplete="current-password" required>
            <button class="toggle-password" id="toggle-password" type="button" aria-label="Mostrar senha" aria-pressed="false">
              <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 10c2.1 3 5.2 5 9 5s6.9-2 9-5"></path>
                <path d="M5 13l-1.5 2M9 15l-.5 2M15 15l.5 2M19 13l1.5 2"></path>
              </svg>
            </button>
          </div>

          <label class="remember-option">
            <input type="checkbox" name="remember">
            <span class="custom-checkbox" aria-hidden="true"></span>
            <span>Manter conectado</span>
          </label>
          <button class="button button-primary login-submit" type="submit">
            Entrar na minha conta <span aria-hidden="true">→</span>
          </button>
          <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
        </form>

        <div class="login-divider"><span></span> ACESSO SEGURO <span></span></div>
        <p class="signup-prompt">
          Ainda não tem uma conta? <a href="index.html">Crie sua conta</a>
        </p>
      </div>
      <p class="login-footnote">
        <span aria-hidden="true">◇</span>
        Login demonstrativo.
      </p>
    </section>
  </main>

  <footer class="login-footer">
    <span>© <span id="current-year"></span> Nexus Hardware</span>
    <span>HARDWARE PARA IR ALÉM.</span>
  </footer>
</body>
</html>
